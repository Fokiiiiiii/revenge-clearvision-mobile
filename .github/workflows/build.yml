name: Build ClearVision
on:
  push:
    paths-ignore: ['**.md', 'plugin-dist/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/checkout@v7
        with:
          repository: revenge-mod/revenge-xposed
          ref: 38a1e69b212dc42c0f424c5e4e913f268b6c89e2
          path: .build-api
      - name: Publish matching native API locally
        working-directory: .build-api
        run: ./gradlew :api:publishToMavenLocal
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run lint:types
      - name: Build native plugin and test bridge validation
        run: bash ./gradlew packageAllPlugins :plugins:clearvision-mobile:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with:
          name: clearvision-plugin
          path: build/dist/*.zip
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
